<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#13201b">
<title>オシダシ</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="オシダシ">
<meta name="mini-category" content="other">
<meta name="mini-desc" content="押して、ぶつけて、落とす。デッキ構築×マス目タクティクスのローグライト">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Mochiy+Pop+One&family=Shippori+Mincho+B1:wght@800&display=swap">
<style>
/* 【見た目】判定のあるもの（床・岩・穴・敵の攻撃マス）を明るく強く、背景は暗く控えめに（桜井 #030） */
:root{
  --bg:#13201b;--bg2:#1b2d26;--panel:#233a31;--fg:#f6efe2;--muted:#b8c4b6;--mar:#7a2533;
  --floor:#e2cfa4;--floor2:#d6c08f;--rock:#5d5a55;--pit:#0b0907;
  --pl:#ff7a3d;--en:#c9312f;--gold:#ffb347;--blk:#5fa8ff;--ok:#5fcf8f;
  --T:56px;
  --f:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;
  --title:"Dela Gothic One","Hiragino Sans",sans-serif;--mincho:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:var(--f);overscroll-behavior:none}
body{display:flex;justify-content:center}
#app{width:100%;max-width:480px;height:100dvh;display:flex;flex-direction:column;position:relative;overflow:hidden;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button{font-family:var(--f);font-weight:800;border:0;border-radius:12px;padding:12px 16px;font-size:16px;cursor:pointer;
  background:var(--gold);color:#2a1d05;box-shadow:0 3px 0 #8a6a1c}
button:active{transform:translateY(2px);box-shadow:0 1px 0 #8a6a1c}
button.sub{background:#4a3f33;color:var(--fg);box-shadow:0 3px 0 #2a231c}
button:disabled{opacity:.4}
.scr{flex:1;display:flex;flex-direction:column;overflow:auto}
#bscr{background:linear-gradient(rgba(19,32,27,.62),rgba(19,32,27,.9)),url(img/bg_class.webp) center/cover}
#bscr.boss{background:linear-gradient(rgba(10,14,30,.72),rgba(10,14,30,.92)),url(img/bg_night.webp) center/cover}
.mapw{background:linear-gradient(rgba(19,32,27,.55),rgba(19,32,27,.8)),url(img/bg_sakura.webp) center/cover fixed}
.cg{display:block;width:100%;max-width:340px;margin:0 auto;border-radius:12px;border:3px solid #f6efe2;box-shadow:0 8px 20px #000a;transform:rotate(-1.5deg)}

/* タイトル */
.title{position:relative;align-items:center;justify-content:flex-end;gap:12px;text-align:center;padding:20px 20px 28px;overflow:hidden;
  background:linear-gradient(180deg,rgba(19,32,27,.15) 0,rgba(58,26,36,.35) 40%,rgba(19,32,27,.9) 80%),url(img/bg_class.webp) center/cover}
.title .girls{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top) + 150px);bottom:200px;pointer-events:none}
html.embed #app{padding-top:0}
html.embed .title .girls{top:150px}
html.embed .title .logo{top:16px}
.title .girls img{position:absolute;bottom:0;height:100%;filter:drop-shadow(0 10px 18px rgba(0,0,0,.45))}
.title .girls .mio{left:-6%;height:94%;animation:gin .6s ease-out .1s backwards}
.title .girls .akane{right:-8%;animation:gin .6s ease-out backwards}
@keyframes gin{from{opacity:0;translate:0 30px}}
.title .shade{position:absolute;left:0;right:0;bottom:0;height:55%;background:linear-gradient(transparent,rgba(19,32,27,.92) 45%,#13201b);pointer-events:none}
.title h1,.title .tag,.title .asc,.title .btns,.title .best{position:relative;z-index:2}
.title .logo{position:absolute;top:calc(env(safe-area-inset-top) + 18px);left:0;right:0;z-index:2}
.title h1{font-family:"Mochiy Pop One",var(--title);font-weight:400;font-size:58px;line-height:1;margin:0;display:flex;justify-content:center;gap:1px;transform:rotate(-4deg)}
.title h1 span{display:inline-block;color:#ff6f9c;-webkit-text-stroke:9px #fff;paint-order:stroke fill;
  filter:drop-shadow(0 4px 0 #b8325e) drop-shadow(0 8px 10px rgba(58,26,36,.45));animation:lbounce .7s cubic-bezier(.3,1.6,.5,1) backwards}
.title h1 span:nth-child(2){color:#ff9a3d;transform:translateY(-6px) rotate(4deg);animation-delay:.06s}
.title h1 span:nth-child(3){color:#ff6f9c;transform:translateY(2px) rotate(-3deg);animation-delay:.12s}
.title h1 span:nth-child(4){color:#ff9a3d;transform:translateY(-4px) rotate(5deg);animation-delay:.18s}
.title h1 span.ex{color:#ffd23f;transform:rotate(12deg);animation-delay:.24s;margin-left:2px}
@keyframes lbounce{from{opacity:0;scale:.3}}
.title .logo .petal{position:absolute;width:26px;height:26px;pointer-events:none}
.title .club{position:relative;display:inline-block;margin-top:12px;background:#fff;color:#c2416b;font-weight:900;font-size:13px;padding:5px 20px;letter-spacing:.12em;
  border-radius:4px;box-shadow:0 3px 0 #b8325e;transform:rotate(-2deg)}
.title .club::before,.title .club::after{content:"";position:absolute;top:4px;width:14px;height:100%;background:#ffc2d4;z-index:-1}
.title .club::before{left:-10px;clip-path:polygon(0 0,100% 0,100% 100%,0 100%,40% 50%)}
.title .club::after{right:-10px;clip-path:polygon(0 0,100% 0,60% 50%,100% 100%,0 100%)}
.title .tag{font-size:18px;font-weight:800}
.title .demo{font-size:44px;letter-spacing:2px;margin:6px 0 4px}
.title .demo span{display:inline-block}
.title .demo .e{animation:demo 1.6s infinite}
@keyframes demo{0%,40%{transform:translateX(0)}55%{transform:translateX(28px)}70%{transform:translate(40px,30px) scale(.2);opacity:0}71%,100%{transform:none;opacity:1}}
.title .demo .p{animation:demo2 1.6s infinite}
@keyframes demo2{0%,30%{transform:none}45%{transform:translateX(14px)}60%,100%{transform:none}}
.title .best{color:var(--muted);font-size:13px}
.title .btns{display:flex;flex-direction:column;gap:10px;width:min(280px,80%)}
.howto{font-size:13px;color:var(--muted);line-height:1.7;max-width:330px;text-align:left}

/* 上の帯 */
.hud{display:flex;align-items:center;gap:8px;padding:6px 8px;background:var(--bg2);font-size:13px;font-weight:700;min-height:42px}
.hpbar{flex:1;height:22px;background:#3a1414;border-radius:11px;position:relative;overflow:hidden;border:2px solid #000}
.hpbar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(#e94d4a,#a82422);transition:width .2s}
.hpbar em{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(45deg,#ffb3b3 0 4px,#ff6b6b 4px 8px);opacity:.85;transition:all .2s}
.hpbar b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;text-shadow:0 1px 2px #000}
.blk{color:var(--blk);font-weight:900}
.relics{display:flex;gap:2px;font-size:16px}
.relics span{cursor:pointer}
.pill{background:#000a;border-radius:10px;padding:2px 7px;white-space:nowrap}

/* 盤 */
#bwrap{display:flex;justify-content:center;padding:14px 0 10px;position:relative}
#board{position:relative;width:calc(var(--T)*6);height:calc(var(--T)*6);border-radius:8px;
  box-shadow:0 0 0 3px #1d2e26,0 0 0 9px #2f4a3a,0 0 0 11px #7a5230,0 12px 30px #000}
.tile{position:absolute;width:var(--T);height:var(--T);border:1px solid rgba(60,30,10,.25)}
.tile.f{background:linear-gradient(rgba(240,205,155,.42),rgba(240,205,155,.42)),url(img/t_floor.webp) center/cover}
.tile.sl::after{content:"";position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,0) 30%,rgba(255,255,255,.65) 45%,rgba(160,220,255,.35) 55%,rgba(255,255,255,0) 70%);background-size:200% 200%;animation:shine 2.4s linear infinite;box-shadow:inset 0 0 0 2px rgba(120,200,255,.6)}
@keyframes shine{from{background-position:100% 100%}to{background-position:-100% -100%}}
.tile.hz::after{content:"";position:absolute;inset:8%;border-radius:40%;background:radial-gradient(circle at 40% 35%,#d9ff9a,#5bd14a 55%,#2b7a2a);opacity:.85;box-shadow:0 0 10px #7dff5a}
.tile.sh{background:linear-gradient(#6b3d1f,#4a2810);box-shadow:inset 0 0 0 3px #2a1608}
.tile.sh::before{content:"";position:absolute;inset:6px 5px;background:repeating-linear-gradient(90deg,#c0392b 0 6px,#2e86c1 6px 11px,#f1c40f 11px 15px,#27ae60 15px 21px,#8e44ad 21px 25px);
  box-shadow:inset 0 -3px 0 #3a1d0a,0 calc(var(--T)*.42) 0 -2px #3a1d0a;clip-path:inset(0 0 52% 0)}
.tile.sh::after{content:"";position:absolute;left:5px;right:5px;top:53%;bottom:6px;background:repeating-linear-gradient(90deg,#16a085 0 5px,#d35400 5px 11px,#2c3e50 11px 16px,#f39c12 16px 22px)}
#board.edge{box-shadow:0 0 0 3px #1d2e26,0 0 0 9px #b8325e,0 0 18px 10px rgba(255,80,120,.45),0 12px 30px #000;animation:edgep 1.6s ease-in-out infinite}
@keyframes edgep{50%{box-shadow:0 0 0 3px #1d2e26,0 0 0 9px #ff6f9c,0 0 26px 14px rgba(255,80,120,.6),0 12px 30px #000}}
#bscr.th-gym{background:linear-gradient(rgba(20,40,70,.7),rgba(15,25,45,.92)),url(img/bg_class.webp) center/cover}
#bscr.th-lib{background:linear-gradient(rgba(60,35,15,.72),rgba(35,20,10,.92)),url(img/bg_class.webp) center/cover}
#bscr.th-lab{background:linear-gradient(rgba(15,55,35,.72),rgba(10,35,25,.92)),url(img/bg_class.webp) center/cover}
#bscr.th-roof{background:linear-gradient(rgba(60,20,40,.45),rgba(25,15,30,.88)),url(img/bg_sakura.webp) center/cover}
#bscr.th-boss{background:linear-gradient(rgba(10,14,30,.72),rgba(10,14,30,.92)),url(img/bg_night.webp) center/cover}
#ruru.on{background:#ff6f9c;color:#fff}
.upcmp{display:flex;align-items:center;justify-content:center;gap:8px}
.upcmp>div{display:flex;flex-direction:column;align-items:center;gap:4px}.upcmp .card{width:92px;height:158px;flex:none}
.upcmp small{color:var(--muted);font-weight:800;font-size:12px}.upcmp .arr{color:var(--gold);font-size:22px}
.updiff{display:flex;flex-direction:column;gap:4px;background:#0006;border-radius:12px;padding:8px 12px}
.updiff div{display:flex;align-items:center;gap:8px;font-weight:800}.updiff span{flex:1;font-size:13px}
.updiff .o{color:var(--muted);text-decoration:line-through}.updiff i{color:var(--gold);font-style:normal}.updiff .n{color:#7dffa0;font-size:20px}
.updiff em{font-style:normal;font-size:10px;background:#2f8f4f;color:#fff;border-radius:6px;padding:1px 6px}
.upstage{position:relative;height:220px;display:flex;align-items:center;justify-content:center;overflow:visible}
.upcard{position:absolute}.upcard .card{width:92px;height:158px;transform:scale(1.25)}
.upold{animation:upold .5s ease-in forwards}
@keyframes upold{0%{transform:scale(1)}60%{transform:scale(1.08);filter:brightness(2.5)}100%{transform:scale(.2) rotate(-20deg);opacity:0}}
.upnew{opacity:0;animation:upnew .55s cubic-bezier(.3,1.6,.5,1) .45s forwards}
@keyframes upnew{from{opacity:0;transform:scale(.3) rotate(15deg);filter:brightness(3)}to{opacity:1;transform:none;filter:none}}
.upnew .card{box-shadow:0 0 0 3px #ffe14a,0 0 26px 6px rgba(255,210,60,.75),0 6px 0 #000}
.upburst{position:absolute;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(255,240,170,.95) 0,rgba(255,180,60,.5) 35%,transparent 70%);opacity:0;animation:upb .9s ease-out .4s forwards}
@keyframes upb{0%{opacity:0;transform:scale(.2)}30%{opacity:1}100%{opacity:0;transform:scale(1.5)}}
.spk{position:absolute;left:50%;top:50%;width:10px;height:10px;margin:-5px;background:#ffe14a;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);opacity:0;animation:spk .7s ease-out forwards}
@keyframes spk{0%{opacity:1;transform:rotate(var(--a)) translateY(0) scale(.5)}100%{opacity:0;transform:rotate(var(--a)) translateY(calc(var(--d)*-1)) scale(1.3)}}
.upttl{text-align:center;animation:upnew .4s ease-out .7s backwards}
.uptx{text-align:center;font-weight:700;margin:0;background:#f6efe2;color:#2a1d18;border-radius:12px;padding:8px 12px}
.mem{display:flex;gap:10px;align-items:center;background:var(--panel);border-radius:14px;padding:8px 10px;border:2px solid transparent;cursor:pointer;text-align:left;width:100%;color:var(--fg);font:inherit;box-shadow:none}
.mem img{width:58px;height:58px;border-radius:50%;object-fit:cover;flex:none;border:3px solid var(--mc);background:#f6efe2}
.mem b{font-size:15px}.mem small{display:block;color:var(--muted);font-size:12px;line-height:1.45;font-weight:600}
.mem.lock{opacity:.45;cursor:default}.mem.lock img{filter:grayscale(1) brightness(.5)}
.mem .bd{font-size:11px;color:var(--gold);font-weight:800}
.modebtn{display:flex;flex-direction:column;align-items:center;gap:2px}
.modebtn small{font-size:11px;font-weight:700;opacity:.8}
.zk{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.zk .card{height:158px;flex:none}
.zk .card.unk{filter:brightness(0) opacity(.35)}
.prof{display:flex;gap:10px;align-items:flex-start}
.prof img{width:110px;flex:none;filter:drop-shadow(0 4px 8px #0008)}
.prof li{margin-bottom:4px}.prof li.lk{color:var(--muted)}
.tile.f.alt{background:linear-gradient(rgba(225,185,130,.4),rgba(225,185,130,.4)),url(img/t_floor2.webp) center/cover}
.tile.r{background:url(img/t_desk.webp) center/cover}
.tile.p{background:url(img/t_pit.webp) center/cover}
.tile .dz{position:absolute;inset:0;pointer-events:none}
.tile.dg .dz{background:repeating-linear-gradient(135deg,rgba(220,30,30,.55) 0 6px,rgba(220,30,30,.32) 6px 12px);box-shadow:inset 0 0 0 2px #b00}
.tile.dz-abs .dz{background:repeating-linear-gradient(135deg,rgba(150,60,230,.55) 0 6px,rgba(150,60,230,.3) 6px 12px);box-shadow:inset 0 0 0 2px #6a1fbf}
.tile.dz-bomb .dz{background:repeating-linear-gradient(135deg,rgba(255,130,0,.6) 0 6px,rgba(255,130,0,.35) 6px 12px);box-shadow:inset 0 0 0 2px #c55a00}
.tile.dz-ch .dz{background:rgba(255,80,0,.35);box-shadow:inset 0 0 0 2px #c55a00}
.tile.dz-sum .dz{box-shadow:inset 0 0 0 3px #3fbf5f;background:rgba(63,191,95,.25)}
.tile.dim .dz{opacity:.35}
.tile .dn{position:absolute;right:2px;bottom:1px;font-size:12px;font-weight:900;color:#fff;text-shadow:0 0 2px #000,0 0 2px #000;pointer-events:none}
.tile.rc::before{content:"";position:absolute;inset:6px;border-radius:50%;background:rgba(42,111,214,.35);box-shadow:0 0 0 2px rgba(42,111,214,.8);animation:pulse 1s infinite}
.tile.tg::before{content:"";position:absolute;inset:1px;border:3px solid #ffe14a;border-radius:6px;box-shadow:0 0 10px #ffe14a;animation:pulse .8s infinite;z-index:3}
@keyframes pulse{50%{opacity:.55}}
#units,#fx{position:absolute;inset:0;pointer-events:none}
.unit{position:absolute;left:0;top:0;width:var(--T);height:var(--T);transition:transform .08s linear;z-index:2}
.tok{position:absolute;left:10%;top:6%;width:80%;height:80%;border-radius:50%;background:#fff8ea;display:flex;align-items:center;justify-content:center;
  font-size:calc(var(--T)*.48);border:3px solid var(--en);box-shadow:0 0 0 2px #000,0 4px 0 rgba(0,0,0,.35);transition:transform .07s}
.unit.pl .tok{border-color:var(--pl);background:#eaf2ff}
.unit.boss .tok,.unit.elite .tok{border-width:4px;border-color:#7a0f0f;background:#ffe2d6}
.unit .hp{position:absolute;left:12%;right:12%;bottom:2px;height:6px;background:#300;border:1px solid #000;border-radius:3px;overflow:hidden}
.unit .hp i{display:block;height:100%;background:#e94d4a;transition:width .15s}
.unit.pl .hp i{background:#4fa3ff}
.unit .ord{position:absolute;left:-2px;top:-2px;width:16px;height:16px;border-radius:50%;background:#000;color:#fff;font-size:10px;font-weight:900;display:flex;align-items:center;justify-content:center;z-index:2}
.unit .it{position:absolute;right:-4px;top:-6px;background:#b00;color:#fff;font-size:10px;font-weight:900;border-radius:8px;padding:1px 4px;border:1px solid #000;z-index:2;white-space:nowrap}
.unit .it.abs{background:#6a1fbf}.unit .it.bomb{background:#c55a00}.unit .it.wait{background:#555}.unit .it.sum{background:#2f8f4f}
.unit .arw{position:absolute;inset:0;pointer-events:none}
.unit .arw::after{content:"";position:absolute;left:50%;top:-1px;margin-left:-6px;border:6px solid transparent;border-bottom:8px solid var(--en);border-top:0;filter:drop-shadow(0 0 1px #000)}
.unit .shd{position:absolute;left:-4px;bottom:6px;background:var(--blk);color:#001a33;font-size:10px;font-weight:900;border-radius:6px;padding:0 4px;border:1px solid #000;z-index:2}
.unit.warn .tok{animation:warn .5s infinite alternate}
@keyframes warn{to{box-shadow:0 0 0 2px #000,0 0 12px 4px #ff3b3b}}
.jit{animation:jit .06s linear infinite}
@keyframes jit{0%{translate:3px 0}25%{translate:-3px 1px}50%{translate:2px -1px}75%{translate:-2px 0}}
.jit1{animation:jit1 .06s linear infinite}
@keyframes jit1{0%{translate:1px 0}50%{translate:-1px 0}}
.wf .tok{filter:brightness(2.2) saturate(0)}
.fall .tok{transition:transform .32s ease-in,opacity .32s;transform:scale(.1) rotate(200deg)!important;opacity:0}
.die .tok{transition:transform .2s,opacity .2s;transform:scale(1.5)!important;opacity:0;filter:brightness(3)}
.num{position:absolute;font-weight:900;font-size:22px;color:#fff;-webkit-text-stroke:1.5px #000;text-shadow:0 2px 0 #000;animation:num .75s ease-out forwards;z-index:9;white-space:nowrap;transform:translateX(-50%)}
.num.blk{color:#8fc6ff;font-size:16px}.num.big{font-size:30px;color:#ffe14a}.num.heal{color:#7dffa0}
@keyframes num{0%{translate:0 0;scale:1.6}15%{scale:1}100%{translate:0 -38px;opacity:0}}
.hm{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;background:#ffe14a;z-index:8;
  clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);
  filter:drop-shadow(0 0 0 #000);animation:hm .16s ease-out forwards}
.hm::after{content:"";position:absolute;inset:8px;background:#fff;clip-path:inherit}
.hm.big{width:70px;height:70px;margin:-35px 0 0 -35px;background:#ff8a00}
@keyframes hm{0%{scale:.3}40%{scale:1.15}100%{scale:1;opacity:0}}
.don{position:absolute;font-family:var(--title);font-size:22px;color:#fff;-webkit-text-stroke:2px #000;transform:translate(-50%,-50%) rotate(-8deg);animation:don .5s ease-out forwards;z-index:9}
@keyframes don{0%{scale:2}20%{scale:1}100%{opacity:0;translate:0 -12px}}
.slash{position:absolute;width:var(--T);height:var(--T);background:rgba(255,255,255,.85);animation:slash .18s ease-out forwards;z-index:7}
.slash.abs{background:rgba(220,190,255,.95)}
@keyframes slash{to{opacity:0;scale:1.25}}
.praise{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);font-family:var(--title);font-size:34px;color:var(--gold);
  -webkit-text-stroke:2px #3b1d00;text-shadow:0 4px 0 #3b1d00;white-space:nowrap;animation:praise .9s ease-out forwards;z-index:20;pointer-events:none}
@keyframes praise{0%{scale:2.2;opacity:0}12%{scale:1;opacity:1}75%{opacity:1}100%{opacity:0;translate:0 -20px}}
.flash{position:absolute;inset:0;z-index:15;pointer-events:none;animation:flash .2s steps(1) forwards}
@keyframes flash{0%{background:rgba(255,255,255,.7)}33%{background:rgba(0,0,0,.5)}66%{background:rgba(255,255,255,.35)}100%{background:transparent}}
.shk-s{animation:shs .18s}.shk-m{animation:shm .26s}.shk-l{animation:shl .4s}
@keyframes shs{0%,100%{translate:0}25%{translate:0 -2px}50%{translate:0 2px}75%{translate:0 -1px}}
@keyframes shm{0%,100%{translate:0}20%{translate:2px -4px}40%{translate:-2px 4px}60%{translate:1px -2px}80%{translate:-1px 1px}}
@keyframes shl{0%,100%{translate:0}12%{translate:-8px 2px}25%{translate:8px -2px}37%{translate:-6px 1px}50%{translate:6px -1px}62%{translate:-3px 0}75%{translate:3px 0}87%{translate:-1px 0}}

/* 情報行・操作 */
.talk{display:flex;align-items:flex-end;gap:6px;margin:4px 8px 0}

<body>
<div id="app"></div>
<script>
'use strict';
/* =====================================================================
   オシダシ — 押して、ぶつけて、落とす。
   面白さの核（桜井 #006 リスクとリターン）：
     敵の近く＝敵の攻撃マスの近く（危ない）ほど、押し出し・穴落とし・同士討ち（大きな見返り）が取れる。
   調整したい数値は【日本語名】でここに出す（桜井 #046 / #068）。
   ===================================================================== */
const P={
  '盤のマス数':6,
  '初期HP':60,
  '毎ターンのエネルギー':3,
  '手札の枚数':5,
  '毎ターンの移動力':2,
  '衝突ダメージ':2,
  '自分が穴に落ちた時のダメージ':10,
  'ボスが穴に落ちた時のダメージ':15,
  'ヒットストップ小ms':60,
  'ヒットストップ中ms':110,
  'ヒットストップ大ms':200,
  '押し出し1マスのms':75,
  '敵行動の間隔ms':240,
  '休憩の回復割合':0.3,
  'カード削除の値段':75,
  '階の数':10,
  '敵HPの階ごとの増加率':0.07,
  '敵攻撃力が上がる階の間隔':3,
};
const N=P['盤のマス数'];
const DX=[0,1,0,-1],DY=[-1,0,1,0];
const FLOOR=0,ROCK=1,PIT=2,SLIDE=3,SHELF=4,HAZ=5;
const walk=v=>v===FLOOR||v===SLIDE||v===HAZ;   // 歩ける床
const solid=v=>v===ROCK||v===SHELF;            // ぶつかる物
const DEBUG=/debug/.test(location.search);
let SPEED=1;
try{if(window.self!==window.top)document.documentElement.classList.add('embed')}catch(e){document.documentElement.classList.add('embed')}
let run=null;
const IMG={akane:'img/akane.webp',mio:'img/mio.webp',akaneF:'img/akane_face.webp',mioF:'img/mio_face.webp'};
const FACE={akane:{},mio:{}};
['smile','shout','laugh','giggle','smug'].forEach(m=>FACE.akane[m]=`img/f_akane_${m}.webp`);
['smile','closed','normal','think','soft'].forEach(m=>FACE.mio[m]=`img/f_mio_${m}.webp`);
const DEF_MOOD={akane:'smile',mio:'normal'};
const faceSrc=(who,mood)=>FACE[who]?(FACE[who][mood]||FACE[who][DEF_MOOD[who]]):MEMBERS[who].face;
['t_floor','t_floor2','t_desk','t_pit'].forEach(k=>{const i=new Image();i.src=`img/${k}.webp`});
['goblin','archer','bomber','knight','mage','oyabun','boss'].forEach(k=>{const i=new Image();i.src=`img/e_${k}.webp`});
Object.values(IMG).concat(Object.values(FACE.akane),Object.values(FACE.mio)).forEach(u=>{const i=new Image();i.src=u});
const LINES={
  fall:['落ちたっ！','穴までいってらっしゃ〜い！','ナイス押し出しっ！','はい、一名様ご案内〜！'],
  ff:['同士討ち、いただき！','仲間に当ててやんの〜！','向き、考えなよね〜'],
  coll:['ドーン！','壁ドンならぬ岩ドン！','いい音したね〜'],
  hurt:['いったぁ…！','まだまだっ！','やるじゃん…！'],
  kill:['よしっ！','一丁あがり！'],
  enemy:['相手の番よ。赤いマスを見て。','来るわ。構えて。'],
  turn:['よーし、こっちの番！','どこから押そっか？'],
  boss:['鬼校長よ。重いから穴に落としても這い上がってくるわ。'],
  win:['見事ね。次へ行きましょう。','上出来よ、アカネ。'],
};
const line=k=>pick(LINES[k]);
const $=s=>document.querySelector(s);
const app=$('#app');
let RNG=Math.random;const rand=()=>RNG();
function seeded(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const todayKey=()=>{const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()};
const rnd=n=>Math.floor(rand()*n);
const pick=a=>a[rnd(a.length)];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const sleep=ms=>new Promise(r=>setTimeout(r,ms*SPEED));
const inB=(x,y)=>x>=0&&y>=0&&x<N&&y<N;
const man=(a,b)=>Math.abs(a.x-b.x)+Math.abs(a.y-b.y);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ls={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
          set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};

/* ---------------- 音（効果音は重要度で音量差・アタック強め残響ほどほど 桜井 #032 #165） ---------------- */
let AC=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(f,dur,type='square',vol=.2,slide=0,delay=0){const a=ac();if(!a)return;const t=a.currentTime+delay;const o=a.createOscillator(),g=a.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f*slide),t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g).connect(a.destination);o.start(t);o.stop(t+dur+.02)}
function noise(dur,vol=.3,hp=800,delay=0){const a=ac();if(!a)return;const t=a.currentTime+delay;const n=Math.floor(a.sampleRate*dur);const b=a.createBuffer(1,n,a.sampleRate);const d=b.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=(rand()*2-1)*Math.pow(1-i/n,2);const s=a.createBufferSource();s.buffer=b;const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp;
  const g=a.createGain();g.gain.value=vol;s.connect(f).connect(g).connect(a.destination);s.start(t)}
const SFX={
  kill(){noise(.35,.5,200);tone(160,.3,'sawtooth',.25,.3)},
  fall(){tone(700,.45,'triangle',.3,.15);noise(.12,.2,2000,.35)},
  coll(){noise(.18,.55,120);tone(90,.2,'square',.3,.5)},
  big(){noise(.06,.5,3000);noise(.22,.45,300);tone(220,.15,'square',.22,.4)},
  hit(){noise(.05,.35,2500);tone(330,.08,'square',.15,.5)},
  hurt(){tone(200,.18,'sawtooth',.25,.5);noise(.1,.3,600)},
  block(){tone(900,.07,'triangle',.18);tone(1300,.09,'triangle',.12,1,.03)},
  card(){tone(660,.05,'triangle',.1)},
  move(){tone(420,.04,'triangle',.07)},
  slide(){noise(.05,.12,1500)},
  zap(){tone(1200,.2,'sawtooth',.18,.2);noise(.15,.25,1500)},
  boom(){noise(.5,.6,80);tone(70,.4,'sawtooth',.3,.4)},
  bad(){tone(150,.08,'square',.12)},
  coin(){tone(990,.06,'square',.1);tone(1320,.1,'square',.1,1,.06)},
  win(){[523,659,784,1046].forEach((f,i)=>tone(f,.18,'square',.13,1,i*.09))},
  lose(){[392,330,262,196].forEach((f,i)=>tone(f,.25,'triangle',.18,1,i*.14))},
  turn(){tone(520,.06,'triangle',.1);tone(780,.08,'triangle',.1,1,.05)},
  summon(){tone(300,.25,'sine',.2,2.5)},
};
const sfx=k=>{try{SFX[k]&&SFX[k]()}catch(e){}};

/* ---------------- カード ----------------
   t: adj=隣の敵 / line=まっすぐ最初の敵 / near=距離r以内の敵 / tile=距離r以内の空きマス / any=距離r以内の空きマスか敵 / self=自分
   性格は一言で言えるまで尖らせる（桜井 #204） */
const CARDS={
  tsuki:{n:'突き',c:1,k:'atk',r:'s',t:'adj',v:{d:4,p:1},u:{d:5,p:2},tx:v=>`隣の敵に${v.d}ダメージ。${v.p}マス押す`,
    fx:async(x,v)=>{await atk(x,v.d);await push(x.u,x.dir,pv(v.p))}},
  kamae:{n:'構え',c:1,k:'def',r:'s',t:'self',v:{b:5},u:{b:8},tx:v=>`ブロック${v.b}`,fx:async(x,v)=>gainBlock(v.b)},
  fumikomi:{n:'踏み込み',c:0,k:'skl',r:'s',t:'self',v:{m:2},u:{m:3},tx:v=>`移動力+${v.m}`,fx:async(x,v)=>addMove(v.m)},
  taiatari:{n:'体当たり',c:2,k:'atk',r:'s',t:'adj',v:{d:3,p:3},u:{d:6,p:3},tx:v=>`隣の敵に${v.d}ダメージ。${v.p}マス押す`,
    fx:async(x,v)=>{await atk(x,v.d);await push(x.u,x.dir,pv(v.p))}},
  harite:{n:'張り手',c:1,k:'atk',r:'c',t:'adj',v:{d:8},u:{d:11},tx:v=>`隣の敵に${v.d}ダメージ（押さない）`,fx:async(x,v)=>atk(x,v.d)},
  shihou:{n:'四方払い',c:1,k:'atk',r:'c',t:'self',adj:1,v:{d:2,p:1},u:{d:3,p:2},tx:v=>`隣のすべての敵に${v.d}ダメージ。それぞれ${v.p}マス押す`,
    fx:async(x,v)=>{const p=B.pl;for(const [e,d] of adjEnemies()){await atk({u:e,dir:d},v.d);await push(e,d,pv(v.p))}}},
  seoi:{n:'背負い投げ',c:1,k:'atk',r:'u',t:'adj',v:{d:4},u:{d:7},tx:v=>`隣の敵に${v.d}ダメージ。自分の後ろへ投げる（重い敵は投げられない）`,
    fx:async(x,v)=>{await atk(x,v.d);await throwBack(x.u,x.dir)}},

function newRun(partner='mio',mode='full'){
  const asc=mode==='daily'?0:Math.min(META.asc||0,META.ascOpen||0);
  if(mode==='daily'){const k=todayKey();let h=0;for(const ch of k)h=(h*31+ch.charCodeAt(0))|0;RNG=seeded(h)}else RNG=Math.random;
  run={hp:P['初期HP'],maxHp:P['初期HP'],gold:50,deck:STARTER.map(id=>({id,up:false})),relics:['mawashi'],asc,newAch:[],partner,mode,day:mode==='daily'?todayKey():null,
    map:null,pos:null,stats:{kills:0,falls:0,ff:0,maxColl:0,turns:0,maxChain:0},retries:0,floorsDone:0,ver:1};
  run.map=genMap(mode==='daily'?6:P['階の数']);
  // 相棒の技を1枚デッキへ
  const pc=MEMBERS[partner].cards.filter(cardOK);if(pc.length)run.deck.push({id:pick(pc),up:false});
  if(A(5))run.gold=0;
  if(A(6)){run.maxHp-=6;run.hp-=6}
  if(A(9))run.deck.push({id:'mayoi',up:false});
  META.runs++;saveMeta();if(META.runs>=10)ach('runs10');
}
function saveRun(){if(run)ls.set('oshidashi.run',run)}

const NODE={battle:{ic:'⚔️',n:'戦闘'},elite:{ic:'💀',n:'強敵（お守り）'},rest:{ic:'🔥',n:'休憩'},shop:{ic:'🛒',n:'店'},event:{ic:'❓',n:'出来事'},boss:{ic:'👿',n:'鬼校長'}};
function genMap(F){
  F=F||P['階の数'];const fl=[];
  for(let f=0;f<F;f++){
    let lanes;
    if(f===0||f===F-1)lanes=[1];
    else{const c=rand()<.55?3:2;lanes=c===3?[0,1,2]:shuffle([0,1,2]).slice(0,2).sort()}
    fl.push(lanes.map(l=>{let t;
      if(f===0)t='battle';else if(f===F-1)t='boss';else if(f===F-2)t=F>=8?'rest':pick(['rest','shop']);
      else if(f===1)t=rand()<.7?'battle':'event';
      else{const w=[['battle',44],['event',18],['shop',f>=2?13:0],['elite',f>=3?13:0],['rest',f>=3&&f!==F-3?12:0]];
        let s=w.reduce((a,b)=>a+b[1],0)*rand();t=w.find(x=>(s-=x[1])<0)[0]}
      return{lane:l,t,to:[]}}));
  }
  // 中盤に強敵を最低1つ保証（ご褒美を目の前に吊るす 桜井 #023）
  if(!fl.some(a=>a.some(n=>n.t==='elite'))){const f=F>=8?4+rnd(3):2+rnd(2);pick(fl[f]).t='elite'}
  for(let f=0;f<F-1;f++)fl[f].forEach(n=>{fl[f+1].forEach((m,j)=>{if(Math.abs(m.lane-n.lane)<=1||fl[f].length===1||fl[f+1].length===1)n.to.push(j)})});

function genTerrain(plPos,avoid,th){

    shuffle(cells);let k=0;const put=(n,v)=>{for(let i=0;i<n&&k<cells.length;i++){const c=cells[k++];g[c.y][c.x]=v}};
    put(rr(th.rocks),ROCK);put(rr(th.pits),PIT);put(rr(th.shelf),SHELF);put(rr(th.haz),HAZ);
    if(th.slide){// 滑る床は、自分の周り以外のどこにでも
      const fl=[];for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(g[y][x]===FLOOR&&man({x,y},plPos)>1)fl.push({x,y});shuffle(fl);
      fl.slice(0,rr(th.slide)).forEach(c=>g[c.y][c.x]=SLIDE)}
    // 歩ける床がすべてつながっているか
    const seen=new Set([plPos.x+','+plPos.y]);const q=[plPos];
    while(q.length){const c=q.shift();for(let d=0;d<4;d++){const nx=c.x+DX[d],ny=c.y+DY[d];if(inB(nx,ny)&&walk(g[ny][nx])&&!seen.has(nx+','+ny)){seen.add(nx+','+ny);q.push({x:nx,y:ny})}}}

  if(!first){banner('あなたの番');sfx('turn')}
  if(B.tut&&B.turn===1)B.tutStep=0;
  if(first&&!B.tut){run.seenTheme=run.seenTheme||{};
    if(!run.seenTheme[B.themeKey]){run.seenTheme[B.themeKey]=1;banner(B.theme.n);say('mio',B.theme.tip,3600,'normal')}
    else if(B.turn===1&&curFloor()<=1&&PT()&&PT()!=='mio')say(PT(),MEMBERS[PT()].lines.start,2600)}
  render();
}
function draw(n,fresh){
  for(let i=0;i<n;i++){
    if(!B.drawP.length){if(!B.disc.length)break;B.drawP=shuffle(B.disc);B.disc=[]}
    if(B.hand.length>=(isP('yuki')?11:10))break;
    const c=B.drawP.pop();c.fresh=1;B.hand.push(c);
  }
  if(!fresh)render();
}
function gainBlock(n){B.block+=n;sfx('block');float(B.pl,'🛡+'+n,'blk');render()}
function addMove(n){B.move+=n;sfx('move');float(B.pl,'👣+'+n,'blk');render()}
async function endTurn(){
  if(B.busy||B.won||B.dead)return;
  B.busy=true;B.sel=-1;B.focus=null;B.undo=null;
  B.disc.push(...B.hand);B.hand=[];
  if(B.tut&&B.tutStep<3)B.tutStep=3;
  render();
  banner('敵の番','en');say('mio',line('enemy'),1200,'think');await sleep(380);
  // 1) 予告どおりに攻撃（同じ情報で動く 桜井 #228：ランダムな命中判定は使わない）
  for(const e of B.units.slice()){
    if(e.pl||!e.alive)continue;
    await enemyAct(e);
    if(B.dead)break;
    if(checkWin())return;
  }
  if(B.dead)return gameOver();
  // 2) 移動して次の予告
  for(const e of enemies()){await aiMove(e);plan(e);render()}
  await sleep(120);
  if(B.tut)B.tutStep=4;
  startTurn(false);
}
async function enemyAct(e){
  const it=e.intent;if(!it)return;
  const gap=P['敵行動の間隔ms'];
  B.acting=e;render();
  if(it.t==='fuse'){await sleep(gap*.4);B.acting=null;return}
  const ts=intentTiles(e);
  if(it.t==='summon'){sfx('summon');for(const [x,y] of ts)if(walk(B.g[y][x])&&!unitAt(x,y)){const u=spawn('goblin',x,y,true);plan(u)}render();await sleep(gap);B.acting=null;return}
  if(it.t==='charge'){
    sfx('big');const d=e.face;
    for(const [x,y] of ts){const o=unitAt(x,y);if(o&&o!==e){await hit(o,it.dmg,e,{big:1});if(o.alive)await push(o,d,1);break}
      e.px=e.x;e.py=e.y;e.x=x;e.y=y;place(e);await sleep(55)}
    await sleep(gap*.6);B.acting=null;return}
  await lunge(e,e.face);
  slashTiles(ts,it.t==='abs'?'abs':'');
  if(it.t==='abs')sfx('zap');
  if(it.t==='bomb'){sfx('boom');flash();shake('l');
    const vs=ts.map(([x,y])=>unitAt(x,y)).filter(Boolean);
    for(const v of vs)if(v!==e)await hit(v,it.dmg,e,{big:1});
    e.alive=false;removeEl(e,'die');B.acting=null;await sleep(gap);return}
  for(const [x,y] of ts){const o=unitAt(x,y);if(o&&o!==e)await hit(o,it.dmg,e)}
  await sleep(gap);B.acting=null;
}

/* ---------- ダメージ・押し出し ---------- */
async function hit(u,d,src,o={}){
  if(!u||!u.alive)return;
  let dealt=d;
  if(u.pl&&B.block>0){const b=Math.min(B.block,d);B.block-=b;dealt=d-b;if(b>0){float(u,'🛡'+b,'blk');sfx('block')}}
  if(dealt<=0&&d>0){render();await sleep(P['ヒットストップ小ms']);return}
  if(d<=0)return;
  u.hp-=dealt;
  const big=dealt>=10||o.big;
  hitmark(u,big);float(u,'-'+dealt,big?'big':'');
  if(u.pl)sfx('hurt');else sfx(big?'big':'hit');
  if(src&&!src.pl&&!u.pl&&src!==u){run.stats.ff++;cutin('同士討ち！','smug');say('akane',line('ff'),1600,'smug');if(run.stats.ff>=3)ach('ff3')}
  if(u.pl){B.hurt=true;if(dealt>=8)say('akane',line('hurt'),1400,'smug')}
  // ヒットストップ：受けた側を大きく、与えた側を小さく震わせる（桜井 #047）
  const hs=big?P['ヒットストップ大ms']:dealt>=5?P['ヒットストップ中ms']:P['ヒットストップ小ms'];
  jit(u,'jit',hs);if(src&&src.alive)jit(src,'jit1',hs);
  shake(big?'m':'s');
  render();
  await sleep(hs);
  if(u.hp<=0)await kill(u);
}
async function kill(u){
  if(u.pl){u.hp=0;B.dead=true;flash();shake('l');sfx('lose');render();await sleep(500);return}
  u.alive=false;run.stats.kills++;sfx('kill');removeEl(u,'die');flash();await sleep(160);render();
}
function collDmg(){return P['衝突ダメージ']+(has('mawashi')?1:0)+(has('chikaraishi')?2:0)+B.kairiki}
async function collide(u,o,nx,ny){
  let cd=collDmg();
  const shelf=!o&&inB(nx,ny)&&B.g[ny][nx]===SHELF;
  if(shelf)cd+=3;
  const fx=(u.x+(nx))/2,fy=(u.y+(ny))/2;
  don(fx,fy,shelf?'バサッ!':'ドン!');sfx('coll');shake('m');
  run.stats.maxColl=Math.max(run.stats.maxColl,cd*(o?2:1));if(cd*(o?2:1)>=12)ach('coll12');
  await hit(u,cd,null);
  if(shelf){B.g[ny][nx]=FLOOR;buildTiles();render()}
  if(o&&o.alive){await hit(o,cd,null);if(!u.pl&&!o.pl){praise('まとめて!');say('akane',line('coll'),1400,'shout')}}
}
async function chainBonus(){
  const n=B.chain||0;B.chain=0;if(n<1||!B||B.dead)return;
  const k=n+1;META.bestChain=Math.max(META.bestChain||0,k);saveMeta();if(k>=3)ach('chain3');
  cutin(k+'連鎖っ！','img/cut_akane.webp');gainBlock(k*2);B.energy+=k>=3?1:0;
  say(PT()&&PT()!=='mio'?PT():'akane',k>=3?'連鎖でエネルギー+1、ブロック+'+k*2+'！':'連鎖ボーナスでブロック+'+k*2+'！',1500,'laugh');
}
async function enterTile(u){// 理科室の薬品
  if(u.alive&&B.g[u.y][u.x]===HAZ){fxEl('don',(u.x+.5)*T,(u.y+.3)*T,'ジュッ!');await hit(u,3,null)}
}
async function push(u,d,n,pull,depth=0){
  if(!u||!u.alive||n<=0)return;
  if(u.def&&u.def.heavy)n=Math.min(n,1);
  let extra=0;
  for(let i=0;i<n;i++){
    const nx=u.x+DX[d],ny=u.y+DY[d];
    if(!inB(nx,ny)&&B.theme&&B.theme.edge&&!pull){// 屋上：盤の外へ落下
      u.px=u.x;u.py=u.y;u.x=nx;u.y=ny;place(u);sfx('slide');await sleep(P['押し出し1マスのms']);
      if(u.pl||(u.def&&u.def.boss)){u.x=u.px;u.y=u.py;place(u)}
      await fall(u,true);return}
    if(!inB(nx,ny)||solid(B.g[ny][nx])){if(!pull)await collide(u,null,nx,ny);return}
    const o=unitAt(nx,ny);
    if(o){if(!pull){await collide(u,o,nx,ny);
        // ドミノ押し：ぶつかった敵も1マス押される（ギュッとしてパッ 桜井 #009）
        if(o.alive&&!o.pl&&depth<8){B.chain=(B.chain||0)+1;run.stats.maxChain=Math.max(run.stats.maxChain||0,B.chain+1);
          if(B.chain>=1)fxEl('don',(o.x+.5)*T,(o.y-.1)*T,(B.chain+1)+'連鎖!');
          await push(o,d,1,false,depth+1)}}
      return}
    u.px=u.x;u.py=u.y;u.x=nx;u.y=ny;place(u);sfx('slide');await sleep(P['押し出し1マスのms']);
    if(B.g[ny][nx]===PIT){await fall(u);return}
    await enterTile(u);if(!u.alive)return;
    if(B.g[ny][nx]===SLIDE&&extra<4&&i===n-1&&!pull){extra++;n++;fxEl('don',(u.x+.5)*T,(u.y+.8)*T,'ツルッ');}
  }
}
async function fall(u,edge){
  if(u.pl||(u.def&&u.def.boss)){
    const dmg=u.pl?P['自分が穴に落ちた時のダメージ']:P['ボスが穴に落ちた時のダメージ'];
    sfx('fall');jit(u,'jit',200);await sleep(200);
    if(!edge){u.x=u.px;u.y=u.py;place(u)}
    if(!u.pl){praise('落ちた!');ach('boss_pit')}
    await hit(u,dmg,null,{big:1});return;
  }
  u.alive=false;run.stats.falls++;sfx('fall');removeEl(u,'fall');cutin('落としたっ！','img/cut_akane.webp');if(PT()&&rand()<.45)say(PT(),MEMBERS[PT()].lines.fall,1500);else say('akane',line('fall'),1600,'laugh');ach('fall1');if(run.stats.falls>=5)ach('falls5');
  if(has('jizo')){heal(3)}
  await sleep(330);render();
}
function heal(n){run.hp=Math.min(run.maxHp,(B?B.pl.hp:run.hp)+n);if(B&&B.pl){B.pl.hp=run.hp;float(B.pl,'+'+n,'heal')}}
async function throwBack(u,dir){
  if(!u.alive)return;
  if(u.def.heavy){praise('重い!');return}
  const p=B.pl,back=(dir+2)%4,tx=p.x+DX[back],ty=p.y+DY[back];
  if(!inB(tx,ty)||solid(B.g[ty][tx])||unitAt(tx,ty)){await collide(u,unitAt(tx,ty)||null,u.x,u.y);return}
  u.px=u.x;u.py=u.y;u.x=tx;u.y=ty;place(u);u.el.querySelector('.tok').style.transform='translateY(-18px) scale(1.15)';sfx('slide');await sleep(150);
  u.el.querySelector('.tok').style.transform='';shake('s');
  if(B.g[ty][tx]===PIT)await fall(u);
}
async function atk(x,d,big){const p=B.pl;await lunge(p,x.dir);if(d>0)await hit(x.u,d+(isP('rin')?2:0),p,{big})}
async function shoot(x){const p=B.pl;const el=document.createElement('div');el.className='don';el.textContent='●';el.style.fontSize='16px';
  el.style.left=(p.x+.5)*T+'px';el.style.top=(p.y+.5)*T+'px';el.style.transition='left .12s linear,top .12s linear';$('#fx').appendChild(el);
  sfx('move');await sleep(16);el.style.left=(x.u.x+.5)*T+'px';el.style.top=(x.u.y+.5)*T+'px';await sleep(120);el.remove()}
async function drop(x,y){const el=document.createElement('div');el.className='don';el.textContent='▬';el.style.fontSize='40px';el.style.color='#c98b4e';el.style.left=(x+.5)*T+'px';el.style.top=(y-1)*T+'px';
  el.style.transition='top .14s ease-in';$('#fx').appendChild(el);await sleep(16);el.style.top=(y+.5)*T+'px';await sleep(140);el.remove();sfx('coll');shake('m')}
const pv=p=>p>0?p+(has('ootsuchi')?1:0):0;

/* ---------- 自分の操作 ---------- */
function reachMap(){if(B.move<=0)return new Map();const R=bfs(B.pl,B.move);R.delete(B.pl.x+','+B.pl.y);return R}
function cardTargets(c){
  const d=CARDS[c.id],p=B.pl,rg=crange(c),t=[];
  if(d.t==='adj'){for(let k=0;k<4;k++){const u=unitAt(p.x+DX[k],p.y+DY[k]);if(u&&!u.pl)t.push({x:u.x,y:u.y,u,dir:k})}}
  else if(d.t==='line'){for(let k=0;k<4;k++){let x=p.x,y=p.y;for(let i=0;i<rg;i++){x+=DX[k];y+=DY[k];if(!inB(x,y)||solid(B.g[y][x]))break;const u=unitAt(x,y);if(u){if(!u.pl)t.push({x,y,u,dir:k});break}}}}
  else if(d.t==='near'){for(const e of enemies())if(man(e,p)<=rg)t.push({x:e.x,y:e.y,u:e})}
  else if(d.t==='tile'||d.t==='any'){for(let y=0;y<N;y++)for(let x=0;x<N;x++){if(man({x,y},p)>rg||(x===p.x&&y===p.y))continue;const u=unitAt(x,y);
    if(walk(B.g[y][x])&&!u)t.push({x,y});else if(d.t==='any'&&u&&!u.pl)t.push({x,y,u})}}
  if(c.id==='iwaotoshi')return t.filter(o=>o.u||keepsLinked(o.x,o.y));// 机で盤を分断して詰ませない
  return t;
}
function keepsLinked(bx,by){
  const ok=(x,y)=>inB(x,y)&&!(x===bx&&y===by)&&walk(B.g[y][x]);
  const all=[];for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(ok(x,y))all.push(x+','+y);
  if(!all.length)return false;const st=B.pl.x+','+B.pl.y;const seen=new Set([st]);const q=[[B.pl.x,B.pl.y]];
  while(q.length){const [x,y]=q.shift();for(let d=0;d<4;d++){const nx=x+DX[d],ny=y+DY[d],k=nx+','+ny;if(ok(nx,ny)&&!seen.has(k)){seen.add(k);q.push([nx,ny])}}}
  return all.every(k=>seen.has(k));
}
function playable(c){if(CARDS[c.id].t==='none')return'使えないカード';if(ccost(c)>B.energy)return'エネルギーが足りない';const d=CARDS[c.id];if(d.t==='self')return d.adj&&!adjEnemies().length?'隣に敵がいない':'';
  return cardTargets(c).length?'':'届く敵がいない'}
async function playCard(i,tg){
  const c=B.hand[i];if(!c)return;
  const why=playable(c);if(why){msg(why);sfx('bad');return}
  B.busy=true;B.sel=-1;B.undo=null;B.focus=null;
  B.energy-=ccost(c);B.hand.splice(i,1);sfx('card');
  render();
  B.chain=0;
  META.seen[c.id]=1;
  await CARDS[c.id].fx(tg||{},cv(c));
  await chainBonus();
  if(CARDS[c.id].ex||c.temp)B.exh.push(c);else B.disc.push(c);
  if(B.tut&&B.tutStep<2&&run.stats.falls>0)B.tutStep=2;
  if(B.dead){return gameOver()}
  if(checkWin())return;
  B.busy=false;render();
}
async function movePl(x,y){
  const R=reachMap();const v=R.get(x+','+y);if(!v)return;
  B.busy=true;B.undo={x:B.pl.x,y:B.pl.y,move:B.move};
  const path=[];let k=x+','+y;while(k&&k!==B.pl.x+','+B.pl.y){const s=R.get(k);path.unshift(s);k=s.prev}
  for(const s of path){B.pl.x=s.x;B.pl.y=s.y;place(B.pl);sfx('move');await sleep(65);await enterTile(B.pl);if(B.dead)return gameOver()}
  B.move-=v.d;B.busy=false;
  if(isP('hina')&&adjEnemies().length&&!B.hinaBlk){B.hinaBlk=1;gainBlock(2)}
  if(B.tut&&B.tutStep===0)B.tutStep=1;
  render();
}
function undoMove(){if(!B.undo||B.busy)return;B.pl.x=B.undo.x;B.pl.y=B.undo.y;B.move=B.undo.move;B.undo=null;place(B.pl);sfx('move');render()}
function checkWin(){
  if(B.won||enemies().length)return false;
  B.won=true;B.busy=true;run.hp=Math.max(1,B.pl.hp);
  (async()=>{await sleep(250);flash();sfx('win');banner('勝ち!');say('mio',line('win'),1500,'closed');await sleep(700);winBattle()})();
  return true;
}

function removeEl(u,cls){if(!u.el)return;u.el.classList.add(cls);const el=u.el;setTimeout(()=>el.remove(),400)}
function jit(u,cls,ms){if(!u.el)return;const t=u.el.querySelector('.tok');t.classList.add(cls);u.el.classList.add('wf');setTimeout(()=>u.el&&u.el.classList.remove('wf'),40*SPEED);setTimeout(()=>t.classList.remove(cls),ms*SPEED)}

  if(B.sel>=0){

function rollCards(n,elite){
  const w=elite?{c:40,u:45,r:15}:{c:60,u:32,r:8};
  const pool=Object.keys(CARDS).filter(k=>CARDS[k].r!=='s'&&CARDS[k].r!=='x'&&cardOK(k));const out=[];
  const pc=PT()?MEMBERS[PT()].cards.filter(k=>pool.includes(k)):[];
  if(pc.length&&rand()<.55){out.push(pick(pc))}  // 相棒の技が出やすい
  while(out.length<n){let s=rand()*100;const r=s<w.c?'c':s<w.c+w.u?'u':'r';const cs=pool.filter(k=>CARDS[k].r===r&&!out.includes(k));if(cs.length)out.push(pick(cs))}
  return out.map(id=>({id,up:rand()<.08}));
}
function rollRelic(){const own=run.relics;const c=Object.keys(RELICS).filter(k=>k!=='mawashi'&&!own.includes(k));return c.length?pick(c):null}
function gainGold(n){n=Math.round(n*(has('maneki')?1.5:1)*(A(5)?.8:1));run.gold+=n;sfx('coin');return n}
function winBattle(){
  const kind=B.kind;if(B.tut){META.tutDone=1;saveMeta()}
  if(!B.hurt)ach('nohit');if(kind==='elite')ach('elite');
  if(has('yakusou'))run.hp=Math.min(run.maxHp,run.hp+5);
  run.floorsDone=curFloor()+1;
  B=null;
  if(kind==='boss')return showEnd(true);
  const g=gainGold(kind==='elite'?28+rnd(10):12+rnd(9));
  const relic=kind==='elite'?rollRelic():null;if(relic)run.relics.push(relic);
  const cards=rollCards(3,kind==='elite');
  app.innerHTML=`<div class="scr">${hudHtml()}<div class="panel"><h2>勝ち！</h2>
    <div class="rew">💰 ${g}ゴールド</div>
    ${relic?`<div class="rew" style="background:#4a3a14">${rimg(relic,40)} <div>お守り「${RELICS[relic].n}」<br><small>${RELICS[relic].tx}</small></div></div>`:''}
    <p style="text-align:center;font-weight:800">技を1つ覚える</p>

  $('#skip').onclick=()=>showMap();

}

  {t:'道端のお地蔵さま',d:'苔むしたお地蔵さまが立っている。',ops:[{l:'手を合わせる（最大HP+6）',f:()=>{run.maxHp+=6;run.hp+=6}},{l:'通り過ぎる',f:()=>{}}]},
  {t:'怪しい行商人',d:'「とっておきの技を30ゴールドでどうだい」',ops:[{l:'買う（−30ゴールド・珍しい技）',ok:()=>run.gold>=30,f:()=>{run.gold-=30;const rs=Object.keys(CARDS).filter(k=>CARDS[k].r==='r'&&cardOK(k));const id=pick(rs.length?rs:Object.keys(CARDS).filter(k=>CARDS[k].r==='u'&&cardOK(k)));run.deck.push({id,up:false});return`「${CARDS[id].n}」を覚えた`}},{l:'断る',f:()=>{}}]},
  {t:'荒れた稽古場',d:'誰もいない稽古場。体を張れば技が磨ける。',ops:[{l:'稽古する（HP−7・ランダムに1枚強化）',ok:()=>run.hp>7,f:()=>{run.hp-=7;const c=shuffle(run.deck.filter(c=>!c.up&&CARDS[c.id].r!=='x'))[0];if(c){upgradeShow(run.deck.indexOf(c),()=>showMap());return{wait:1}}}},{l:'通り過ぎる',f:()=>{}}]},
  {t:'古い道場',d:'師範が言う。「技を一つ忘れなさい。身軽になる」',ops:[{l:'忘れる（カードを1枚選んで捨てる）',pick:1},{l:'断る',f:()=>{}}]},
  {t:'落ちていた財布',d:'道に財布が落ちている。',ops:[{l:'拾う（+40ゴールド）',f:()=>{run.gold+=40}},{l:'交番に届ける（最大HP+3、HP全快）',f:()=>{run.maxHp+=3;run.hp=run.maxHp}}]},
  {t:'力自慢の像',d:'岩を持ち上げる力士の像。台座に「押せ」と彫られている。',ops:[{l:'押してみる（HP−5・お守りをもらう）',ok:()=>run.hp>5,f:()=>{run.hp-=5;const r=rollRelic();if(r){run.relics.push(r);return`「${RELICS[r].n}」を手に入れた`}}},{l:'やめておく',f:()=>{}}]},
];
function showEvent(){B=null;
  const ev=pick(EVENTS);
  app.innerHTML=`<div class="scr">${hudHtml()}<div class="panel"><h2>❓ ${ev.t}</h2><p style="text-align:center">${ev.d}</p>
    ${ev.ops.map((o,i)=>`<button class="${i?'sub':''} opt" data-i="${i}" ${o.ok&&!o.ok()?'disabled':''}>${o.l}</button>`).join('')}<p id="evr" style="text-align:center;font-weight:800"></p></div></div><div id="modal"></div>`;
  hudBind();
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const o=ev.ops[+b.dataset.i];
    if(o.pick)return pickCard('捨てるカード',()=>true,i=>{run.deck.splice(i,1);sfx('coin');showMap()});
    const r=o.f();if(r&&r.wait)return;sfx('coin');if(r){$('#evr').textContent=r;document.querySelectorAll('.opt').forEach(x=>x.disabled=true);setTimeout(showMap,1200)}else showMap()});
}

/* =====================================================================
   終わり・タイトル
   ===================================================================== */
function scoreOf(win){const s=run.stats;return Math.round((run.floorsDone*100+s.falls*15+s.ff*25+s.kills*5+(win?1000:0)-run.retries*80)*(1+.1*(run.asc||0)))}
function rankOf(sc){return sc>=1700?'S':sc>=1200?'A':sc>=700?'B':'C'}
/* スコアは部の称号で見せる（桜井 #003 スコアの見せ方） */
const CLUB=[[0,'帰宅部'],[400,'同好会'],[800,'地区大会出場'],[1200,'県大会出場'],[1700,'全国大会出場'],[2400,'伝説の部長']];
const clubOf=sc=>CLUB.filter(c=>sc>=c[0]).pop()[1];
function gameOver(){
  B.busy=true;const snap=B.snap,spec=B.spec;
  setTimeout(()=>showEnd(false,snap,spec),400);
}
function showEnd(win,snap,spec){
  clearRun();
  if(!run.metaDone){run.metaDone=1;META.kills+=run.stats.kills;META.falls+=run.stats.falls;META.ff+=run.stats.ff;
    const pk=PT()||'mio';const gain=run.floorsDone+(win?5:0);run.bondGain=gain;META.bond[pk]=(META.bond[pk]||0)+gain;
    if(win){META.memWins=META.memWins||{};META.memWins[pk]=1;if(Object.keys(MEMBERS).every(k=>META.memWins[k]))ach('allmem')}
    if(run.mode==='daily'){const d=META.daily[run.day]||{};const first=win&&!d.done;
      META.daily[run.day]={done:d.done||win,score:Math.max(d.score||0,scoreOf(win))};
      if(first){run.dailyFirst=1;META.bond[pk]+=3;if(Object.values(META.daily).filter(x=>x.done).length>=3)ach('daily3')}}
    if(win&&run.mode!=='daily'){META.wins++;ach('win1');if(run.asc>=5)ach('asc5');if(run.asc>=10)ach('asc10');if(run.deck.length<=8)ach('thin');
      if((run.asc||0)>=(META.ascOpen||0)&&META.ascOpen<10){META.ascOpen=(run.asc||0)+1;META.asc=META.ascOpen;run.ascUp=META.ascOpen}}
    if(META.kills>=100)ach('kills100');saveMeta()}
  const na=(run.newAch||[]).map(id=>ACH.find(a=>a.id===id));
  const sc=scoreOf(win),rk=rankOf(sc),s=run.stats;
  const best=ls.get('oshidashi.best',{score:0});const nb=run.mode!=='daily'&&sc>best.score;if(nb)ls.set('oshidashi.best',{score:sc,floor:run.floorsDone,win,rank:rk});
  const pm=MEMBERS[PT()||'mio'];
  const reach=(run.mode==='daily'?'今日の放課後：':'')+(win?'鬼校長を倒した！':`${run.pos?run.pos.f+1:1}階で力尽きた`);
  app.innerHTML=`<div class="scr"><div class="panel"><h2>${win?'優勝！':'負けた…'}</h2>
    <p style="text-align:center;font-weight:800">${reach}</p>
    <img class="cg" src="img/${win?'cg_selfie':'cg_sunset'}.webp" alt="">
    <p style="text-align:center;font-weight:700;margin-top:-4px">${win?'「やったー！ 優勝だよ、会長！」':'「次は作戦を変えましょう。…まだいけるわね、アカネ？」'}</p>
    <div class="rank">${rk}</div><p style="text-align:center;font-weight:800;font-size:18px;color:var(--gold);margin-top:-6px">${clubOf(sc)}</p>
    <p style="text-align:center">スコア ${sc}${nb?' <b style="color:var(--gold)">自己ベスト！</b>':''}</p>
    <div class="rew"><img src="${pm.face}" alt="" style="width:44px;height:44px;border-radius:50%;object-fit:cover;border:3px solid ${pm.col}"><div>${pm.n}との絆 +${run.bondGain||0}${run.dailyFirst?'（今日の放課後 初クリア +3）':''}<br><small>累計 ${META.bond[PT()||'mio']||0}　${pm.lines.win&&win?'「'+pm.lines.win+'」':''}</small></div></div>
    ${run.ascUp?`<div class="rew" style="background:#4a1d10">🔥 本気度${run.ascUp}が解放された！（${ASC[run.ascUp]}）</div>`:''}
    ${na.length?`<div class="stats"><b>今回の実績</b><br>${na.map(a=>`${a.ic} ${a.n}${a.un?`（技「${CARDS[a.un].n}」解放）`:''}`).join('<br>')}</div>`:''}
    <div class="stats">${run.asc?`本気度 ${run.asc}（スコア×${(1+.1*run.asc).toFixed(1)}）<br>`:''}最大連鎖 ${s.maxChain||0}<br>倒した敵 ${s.kills}　<br>穴に落とした ${s.falls}（×15）<br>同士討ち ${s.ff}（×25）<br>いちばん痛い衝突 ${s.maxColl}<br>やり直し ${run.retries}回</div>
    ${!win&&snap?`<button id="retry">この戦闘をやり直す</button>`:''}
    <button class="${!win&&snap?'sub':''}" id="again">最初から</button><button class="sub" id="tt">タイトルへ</button></div></div>`;
  if(win){sfx('win');confetti()}
  if($('#retry'))$('#retry').onclick=()=>{const na2=run.newAch;run=snap;run.newAch=na2;run.retries++;startBattle(spec.kind,spec)};
  $('#again').onclick=()=>showSelect(run.mode||'full');
  $('#tt').onclick=()=>showTitle();
}
function memberCard(k,sel){const m=MEMBERS[k];const ok=memberOK(k);
  return `<button class="mem ${ok?'':'lock'}" data-k="${k}" style="--mc:${m.col}"><img src="${m.face}" alt=""><div><b>${ok?m.n:'？？？'}</b> <span style="font-size:12px;color:${m.col};font-weight:800">${m.role}</span>
   <small>${ok?m.perk:'解放条件：'+m.unlock.tx}</small>${ok?`<span class="bd">絆 ${META.bond[k]||0}${META.memWins&&META.memWins[k]?'　🏆':''}</span>`:''}</div></button>`}
function showSelect(mode){
  B=null;
  app.innerHTML=`<div class="scr"><div class="panel"><h2 style="font-size:24px">${mode==='daily'?'今日の放課後':'相棒を選ぶ'}</h2>
    <p style="text-align:center;font-size:13px;color:var(--muted)">${mode==='daily'?'今日だけの6階。毎日同じ盤面で、初クリアで絆+3。':'選んだ部員の技が出やすくなり、固有の力が付きます。'}</p>
    ${Object.keys(MEMBERS).map(k=>memberCard(k)).join('')}
    <button class="sub" id="back">もどる</button></div></div><div id="modal"></div>`;
  document.querySelectorAll('.mem').forEach(b=>b.onclick=()=>{const k=b.dataset.k;if(!memberOK(k)){sfx('bad');return}
    ac();sfx('win');newRun(k,mode);showMap()});
  $('#back').onclick=()=>showTitle();
}
function showMembers(){
  modal(`<h3>おしだし部 部員名簿</h3>${['akane'].concat(Object.keys(MEMBERS)).map(k=>{
    if(k==='akane')return `<div class="prof"><img src="img/akane.webp" alt=""><div><b>押切アカネ</b> <small style="color:#ff7a3d">主人公</small><ul style="padding-left:18px;margin:6px 0;font-size:13px">
      <li>押し出し担当。とにかく前に出る。</li><li>白い鉢巻は中学の部活の先輩からもらった。</li><li>好物はたこ焼き。</li></ul></div></div>`;
    const m=MEMBERS[k],ok=memberOK(k),b=META.bond[k]||0;if(!ok)return memberCard(k);
    const th=[0,5,15];
    return `<div class="prof"><img src="${m.full}" alt=""><div><b>${m.n}</b> <small style="color:${m.col}">${m.role}</small>　<small class="bd" style="color:var(--gold)">絆 ${b}</small>
      <ul style="padding-left:18px;margin:6px 0;font-size:13px">${m.prof.map((t,i)=>b>=th[i]?`<li>${t}</li>`:`<li class="lk">🔒 絆${th[i]}で解放</li>`).join('')}</ul><small style="color:var(--muted)">${m.perk}</small></div></div>`}).join('<hr style="border:0;border-top:1px solid #fff2;margin:4px 0">')}
    <button onclick="closeModal()">閉じる</button>`)}
function showZukan(){
  const ids=Object.keys(CARDS).filter(k=>k!=='mayoi');const n=ids.filter(k=>META.seen[k]).length;
  modal(`<h3>技の図鑑 ${n}/${ids.length}</h3><p style="font-size:12px;color:var(--muted);margin:0">戦闘で一度使うと登録されます。</p>
    <div class="zk">${ids.map(id=>META.seen[id]?cardHtml({id,up:false}):`<div class="card unk ${CARDS[id].k} r${RAR[CARDS[id].r]}">${cardInner({id,up:false})}</div>`).join('')}</div>
    <button onclick="closeModal()">閉じる</button>`)}
function showAch(){
  modal(`<h3>実績 ${ACH.filter(a=>META.ach[a.id]).length}/${ACH.length}</h3>
   ${ACH.map(a=>`<div class="ach ${META.ach[a.id]?'':'no'}"><span class="i">${META.ach[a.id]?a.ic:'🔒'}</span><div><b>${a.n}</b><br>${a.d}${a.un?`<br><small>→ 技「${CARDS[a.un].n}」が出るように</small>`:''}</div></div>`).join('')}
   <div class="stats">挑戦 ${META.runs}回　優勝 ${META.wins}回<br>累計：倒した敵 ${META.kills}・穴落とし ${META.falls}・同士討ち ${META.ff}<br>解放した本気度 ${META.ascOpen}/10</div>
   <button onclick="closeModal()">閉じる</button>`);
}
function confetti(){for(let i=0;i<60;i++){const el=document.createElement('div');el.className='conf';el.style.left=rand()*100+'%';
  el.style.background=pick(['#f2c14e','#e94d4a','#4fa3ff','#5fcf8f','#fff']);el.style.animationDuration=(1.6+rand()*1.6)+'s';el.style.animationDelay=rand()*.6+'s';app.appendChild(el);setTimeout(()=>el.remove(),4000)}}
function showTitle(){
  B=null;
  const saved=ls.get('oshidashi.run',null);const best=ls.get('oshidashi.best',null);const dd=META.daily[todayKey()];
  app.innerHTML=`<div class="scr title">
    <div class="girls"><img class="mio" src="${IMG.mio}" alt="生徒会長・天道ミオ"><img class="akane" src="${IMG.akane}" alt="押切アカネ"></div><div class="shade"></div>
    <div class="logo"><svg class="petal" viewBox="0 0 24 24" style="left:9%;top:-4px;transform:rotate(-20deg)" aria-hidden="true"><g fill="#ffc2d4" stroke="#fff" stroke-width="1.2"><ellipse cx="12" cy="6" rx="3.6" ry="5.5"/><ellipse cx="12" cy="6" rx="3.6" ry="5.5" transform="rotate(72 12 12)"/><ellipse cx="12" cy="6" rx="3.6" ry="5.5" transform="rotate(144 12 12)"/><ellipse cx="12" cy="6" rx="3.6" ry="5.5" transform="rotate(216 12 12)"/><ellipse cx="12" cy="6" rx="3.6" ry="5.5" transform="rotate(288 12 12)"/></g><circle cx="12" cy="12" r="2.2" fill="#ffd23f"/></svg><svg class="petal" viewBox="0 0 24 24" style="right:7%;top:54px;width:20px;height:20px;transform:rotate(30deg)" aria-hidden="true"><g fill="#ffc2d4" stroke="#fff" stroke-width="1.2"><ellipse cx="12" cy="6" rx="3.6" ry="5.5"/><ellipse cx="12" cy="6" rx="3.6" ry="5.5" transform="rotate(72 12 12)"/><ellipse cx="12" cy="6" rx="3.6" ry="5.5" transform="rotate(144 12 12)"/><ellipse cx="12" cy="6" rx="3.6" ry="5.5" transform="rotate(216 12 12)"/><ellipse cx="12" cy="6" rx="3.6" ry="5.5" transform="rotate(288 12 12)"/></g><circle cx="12" cy="12" r="2.2" fill="#ffd23f"/></svg><h1><span>オ</span><span>シ</span><span>ダ</span><span>シ</span><span class="ex">！</span></h1><div class="club">放課後おしだし部</div></div>
    <div class="tag">押して、ぶつけて、落とせ。</div>
    ${META.ascOpen?`<div class="asc"><button class="sub" id="am">−</button><span>本気度 <span id="av">${META.asc}</span>　<small id="ad" style="color:var(--muted);font-weight:600"></small></span><button class="sub" id="ap">＋</button></div>`:'<div class="best">優勝すると「本気度」が解放される</div>'}
    <div class="btns"><button id="go" class="modebtn">部活をはじめる<small>全10階・鬼校長まで（15〜30分）</small></button>
      <button class="sub modebtn" id="daily" style="${dd&&dd.done?'':'background:#2f5a48'}">今日の放課後${dd&&dd.done?' ✓':''}<small>${dd&&dd.done?'今日はクリア済み（何度でも遊べる）':'全6階・日替わり（5〜10分）'}</small></button>
      ${saved&&saved.ver===1?'<button class="sub" id="cont">つづきから</button>':''}
      <div style="display:flex;gap:8px"><button class="sub" id="memb" style="flex:1">部員</button><button class="sub" id="zkb" style="flex:1">図鑑 ${Object.keys(META.seen).filter(k=>CARDS[k]&&k!=='mayoi').length}/24</button></div>
      <div style="display:flex;gap:8px"><button class="sub" id="achb" style="flex:1">実績 ${ACH.filter(a=>META.ach[a.id]).length}/${ACH.length}</button><button class="sub" id="how" style="flex:1">遊び方</button></div></div>
    <div class="best">${best?`自己ベスト ${best.score}（${best.rank}）${best.win?' 優勝':` ${best.floor}階まで`}`:'デッキ構築 × マス目タクティクス'}</div>
  </div><div id="modal"></div>`;
  // 最初の3分で面白さを（桜井 #017）：説明画面を挟まず、いきなり1戦目（チュートリアル込み）
  $('#go').onclick=()=>{ac();sfx('win');if(!META.tutDone){newRun('mio','full');showMap()}else showSelect('full')};
  $('#daily').onclick=()=>{ac();sfx('card');showSelect('daily')};
  $('#memb').onclick=()=>showMembers();$('#zkb').onclick=()=>showZukan();
  if($('#cont'))$('#cont').onclick=()=>{ac();run=saved;RNG=Math.random;showMap()};
  $('#how').onclick=()=>showHelp();
  $('#achb').onclick=()=>showAch();
  if($('#am')){const upd=()=>{$('#av').textContent=META.asc;$('#ad').textContent=META.asc?'（'+ASC[META.asc]+' ほか）':'（ふつう）';saveMeta()};upd();
    $('#am').onclick=()=>{META.asc=Math.max(0,META.asc-1);upd()};$('#ap').onclick=()=>{META.asc=Math.min(META.ascOpen,META.asc+1);upd()}}
}

/* ---------- 自動プレイ（確認用：?debug で window.autoplay()） ---------- */
window.__state=()=>({run,B});
window.autoStep=async function(){
  if(!B||!B.dom||B.busy||B.won||B.dead)return false;
  for(let i=0;i<B.hand.length;i++){const c=B.hand[i];if(playable(c))continue;const d=CARDS[c.id];
    if(d.t==='self'){await playCard(i);return true}const t=cardTargets(c);if(t.length){await playCard(i,pick(t));return true}}
  const R=[...reachMap().values()].filter(v=>!unitAt(v.x,v.y));
  if(R.length&&B.move>0&&rand()<.7){const v=pick(R);await movePl(v.x,v.y);return true}
  await endTurn();return true;
};
showTitle();
</script>
